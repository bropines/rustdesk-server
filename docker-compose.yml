# hbbs + hbbr + RD Panel in one container. Full example and options:
# https://github.com/bropines/rdpanel/blob/main/deploy/compose.example.yml
services:
  rustdesk:
    image: ghcr.io/bropines/rdpanel:latest
    container_name: rustdesk
    # hbbs needs the real client IPs (UDP hole punching, IP blocker).
    network_mode: host
    environment:
      - RELAY=<relay_server[:21117]>
      - ENCRYPTED_ONLY=1
      - MUST_LOGIN=N
      - TCP_KEEPALIVE=N
      - RDPANEL_PUBLIC_URL=https://<api_server>
      - RUSTDESK_API_JWT_KEY=<random secret>
    volumes:
      # hbbs/hbbr keys (id_ed25519*), db_v2.sqlite3 and the panel data.
      - ./data:/data
    restart: unless-stopped
